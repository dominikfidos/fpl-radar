apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fpl-radar.fullname" . }}
  labels:
    {{- include "fpl-radar.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fpl-radar.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below desired capacity during a rollout
      maxSurge: 1         # start one extra pod, wait until Ready, then retire an old one
  template:
    metadata:
      labels:
        {{- include "fpl-radar.selectorLabels" . | nindent 8 }}
      annotations:
        # When the ConfigMap changes, this hash changes, so the pods are replaced
        # and pick up the new settings.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001   # same UID as in the Dockerfile
      containers:
        - name: api
          image: {{ include "fpl-radar.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
          envFrom:
            - configMapRef:
                name: {{ include "fpl-radar.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:   # not Ready -> Service sends no traffic to this pod
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:    # keeps failing -> kubelet restarts the container
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
