apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fpl-radar.fullname" . }}-config
  labels:
    {{- include "fpl-radar.labels" . | nindent 4 }}
data:
  FPL_LEAGUE_ID: {{ .Values.config.leagueId | quote }}
  FPL_ENTRY_ID: {{ .Values.config.entryId | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.config.rateLimitPerMinute | quote }}
