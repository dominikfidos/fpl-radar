{{- if .Values.leagueRefresh.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "fpl-radar.fullname" . }}-league-refresh
  labels:
    {{- include "fpl-radar.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.leagueRefresh.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: league-refresh
              image: {{ include "fpl-radar.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "app.league.refresh"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.existingSecret }}
                      key: {{ .Values.database.urlKey }}
              envFrom:
                - configMapRef:
                    name: {{ include "fpl-radar.fullname" . }}-config
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
{{- end }}
