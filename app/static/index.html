<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Radar – league differentials</title>
<meta name="description" content="Find Fantasy Premier League differentials that the managers above you in your mini-league do not own.">
<style>
  :root {
    --bg: #f5f4fa; --card: #ffffff; --ink: #1c1730; --muted: #6a6585; --line: #e3e0ef;
    --accent: #5b2bd9; --accent-ink: #ffffff; --good: #0f9d6b; --good-bg: #dcf5ea;
    --warn-bg: #fff4d6; --bar: #cfc9e6; --bar-mine: #5b2bd9; --err-bg: #fde4e4; --err: #a11d1d;
    --d1: #bfeed6; --d2: #dcf3c8; --d3: #ecebf3; --d4: #fbd5bd; --d5: #f6b3b3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12101c; --card: #1c1930; --ink: #ece9f8; --muted: #a39dc2; --line: #302c4a;
      --accent: #9b7bff; --accent-ink: #12101c; --good: #4ddba8; --good-bg: #163a2e;
      --warn-bg: #3a3116; --bar: #3a3560; --bar-mine: #9b7bff; --err-bg: #3d1a1a; --err: #ff9b9b;
      --d1: #15523a; --d2: #2d4d1f; --d3: #33304d; --d4: #5c3a20; --d5: #662626;
    }
  }
  * { box-sizing: border-box; }
  :root { color-scheme: light dark; }
  /* Slim scrollbars in the page palette (Firefox first, then Chrome/Edge/Safari). */
  * { scrollbar-width: thin; scrollbar-color: var(--bar) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: var(--bar); border-radius: 999px; border: 2px solid transparent; background-clip: content-box;
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--accent); background-clip: content-box; }
  *::-webkit-scrollbar-corner { background: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 56px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .tagline { margin: 4px 0 20px; color: var(--muted); }
  h2 { font-size: 1.15rem; margin: 32px 0 4px; }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 0 0 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  }
  form { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  label { display: grid; gap: 4px; align-content: start; font-size: 0.9rem; font-weight: 600; }
  label small { font-weight: 400; color: var(--muted); }
  input, select {
    font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); width: 100%;
  }
  input[type=range] { padding: 0; accent-color: var(--accent); }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: 0.6; cursor: progress; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .actions { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  details { margin-top: 14px; color: var(--muted); font-size: 0.92rem; }
  details summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
  #status { margin-top: 16px; }
  .msg { padding: 12px 14px; border-radius: 10px; }
  .msg.error { background: var(--err-bg); color: var(--err); }
  .msg.info { background: var(--warn-bg); }
  .summary { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 0.92rem; }
  .pill b { color: var(--accent); }
  .swap {
    display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 12px; align-items: center;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .swap:first-child { border-top: 0; }
  .arrow { color: var(--muted); font-size: 1.3rem; }
  .player strong { display: block; }
  .player .sub { display: block; color: var(--muted); font-size: 0.84rem; }
  .gain { background: var(--good-bg); color: var(--good); font-weight: 700; border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
  .out strong { text-decoration: line-through; text-decoration-color: var(--muted); }
  .grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .diff { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); }
  .bars { display: grid; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: minmax(110px, 190px) 1fr 48px; gap: 10px; align-items: center; font-size: 0.9rem; }
  .bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: var(--bg); border-radius: 6px; height: 16px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--bar); border-radius: 6px; }
  .bar-row.mine .bar-fill { background: var(--bar-mine); }
  .bar-row.mine .bar-name { font-weight: 700; }
  .bar-count { text-align: right; color: var(--muted); }
  .legend { display: flex; gap: 16px; font-size: 0.85rem; color: var(--muted); margin: 0 0 10px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--bar); }
  .dot.mine { background: var(--bar-mine); }
  ul.notes { color: var(--muted); font-size: 0.9rem; padding-left: 20px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
  footer a { color: var(--accent); }
  .lang { display: flex; gap: 6px; }
  .lang button { padding: 4px 10px; }
  .lang button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }
  .tabs { display: flex; gap: 2px; margin-top: 22px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button {
    background: transparent; color: var(--muted); border-radius: 8px 8px 0 0; padding: 10px 14px;
    border: 0; border-bottom: 3px solid transparent; white-space: nowrap; box-shadow: none; cursor: pointer;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .panel { padding-top: 4px; }
  .panel:focus { outline: none; }
  .panel > section > h2:first-child { margin-top: 18px; }
  .cap-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .cap-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .cap-card h3 { margin: 0 0 4px; font-size: 0.78rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
  .cap-name { font-size: 1.25rem; font-weight: 700; }
  .cap-card .sub { display: block; color: var(--muted); font-size: 0.86rem; }
  .scroll { overflow-x: auto; }
  tr.me-row td, tr.me-row th { background: var(--good-bg); font-weight: 700; }
  .up { color: var(--good); } .down { color: var(--err); }
  /* Rank history chart: you in the accent colour, everybody else a recessive grey. */
  .rc { position: relative; margin: 6px 0 10px; }
  .rc svg { display: block; max-width: 100%; overflow: visible; }
  .rc svg:focus-visible { outline-offset: 4px; }
  .rc-grid { stroke: var(--line); stroke-width: 1; }
  .rc-tick { fill: var(--muted); font-size: 12px; }
  .rc-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rc-line.other { stroke: var(--muted); opacity: 0.45; }
  .rc-line.me { stroke: var(--accent); }
  .rc-dot { stroke: var(--card); stroke-width: 2; }
  .rc-dot.me { fill: var(--accent); } .rc-dot.other { fill: var(--muted); }
  .rc-label { fill: var(--muted); font-size: 12px; } .rc-label.me { fill: var(--ink); font-weight: 700; }
  .rc-cross { stroke: var(--muted); stroke-width: 1; opacity: 0.6; pointer-events: none; }
  .rc-tip { position: absolute; z-index: 2; pointer-events: none; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 0.85rem;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18); max-width: 260px; }
  .rc-tip-head { color: var(--muted); font-size: 0.78rem; margin-bottom: 4px; }
  .rc-tip-row { display: flex; gap: 8px; align-items: baseline; white-space: nowrap; }
  .rc-tip-row span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .rc-tip-row.me span { color: var(--ink); }
  .key { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
  .key.me { background: var(--accent); } .key.other { background: var(--muted); opacity: 0.6; }
  .rc-tip-row .key { flex: none; align-self: center; margin-right: 0; }
  .rc-legend { margin-top: 12px; }
  .riv { margin-top: 12px; display: grid; gap: 10px; }
  .riv-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .riv-head .sub { display: block; color: var(--muted); font-size: 0.84rem; }
  .riv-rank { text-align: right; font-size: 1.15rem; font-weight: 700; color: var(--accent); }
  .riv-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 4px 12px; font-size: 0.92rem; align-items: start; }
  .riv-label { color: var(--muted); }
  .riv-value { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .riv-moves { display: grid; gap: 8px; width: 100%; }
  .riv-gw { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; align-items: start; }
  .riv-gw b { color: var(--accent); padding-top: 3px; }
  .riv-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill-move { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px 9px; font-size: 0.86rem; white-space: nowrap; }
  .pill-move s { color: var(--muted); }
  @media (max-width: 640px) { .riv-row { grid-template-columns: 1fr; } }
  .plan { margin-top: 10px; }
  .plan-title { margin: 0 0 2px; font-size: 0.78rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
  .plan-sum { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; font-size: 0.9rem; color: var(--muted); }
  .gain.bad { background: var(--err-bg); color: var(--err); }
  .gain.warn { background: var(--warn-bg); color: var(--ink); }
  .pricetbl td .sub { display: block; color: var(--muted); font-size: 0.78rem; font-weight: 400; }
  .pricetbl td { vertical-align: top; }
  .layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  .live .card { padding: 4px 14px 14px; }
  .live h2 { margin-top: 24px; }
  .live-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .live-head .hint { margin: 0; }
  .live td .sub { display: block; color: var(--muted); font-size: 0.78rem; font-weight: 400; }
  .live-table td { vertical-align: top; }
  @media (min-width: 1100px) {
    .wrap { max-width: 1400px; }
    .layout { grid-template-columns: minmax(0, 1fr) 460px; }
    .live { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
  }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { padding: 6px 8px; text-align: left; border-top: 1px solid var(--line); vertical-align: middle; }
  thead th { border-top: 0; color: var(--muted); font-weight: 600; }
  th[scope=row] .sub { display: block; color: var(--muted); font-size: 0.78rem; font-weight: 400; }
  .ticker td { white-space: nowrap; }
  .fx { display: inline-block; margin: 1px 3px 1px 0; padding: 3px 8px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; }
  .fx.d1 { background: var(--d1); } .fx.d2 { background: var(--d2); } .fx.d3 { background: var(--d3); }
  .fx.d4 { background: var(--d4); } .fx.d5 { background: var(--d5); }
  .fx.blank { color: var(--muted); font-weight: 400; background: transparent; border: 1px dashed var(--line); }
  .legend .fx { margin: 0 2px 0 0; padding: 1px 8px; }
  .msg.info + .msg.info { margin-top: 6px; }
  @media (max-width: 640px) {
    .swap { grid-template-columns: 1fr; gap: 6px; }
    .arrow { display: none; }
    .gain { justify-self: start; }
    .bar-row { grid-template-columns: 100px 1fr 40px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>FPL <span>Radar</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" class="ghost" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="ghost" data-lang="pl" aria-pressed="false">PL</button>
    </div>
  </header>

  <section class="card" aria-labelledby="form-title">
    <form id="form">
      <label><span data-i18n="league"></span>
        <input id="league" name="league" inputmode="numeric" pattern="[0-9]+" required placeholder="156486">
      </label>
      <label><span data-i18n="entry"></span>
        <input id="entry" name="entry" inputmode="numeric" pattern="[0-9]+" required placeholder="4006393">
      </label>
      <label><span data-i18n="rivals"></span>
        <input id="rivals" name="rivals" type="number" min="1" max="10" value="5">
      </label>
      <label><span data-i18n="mode"></span>
        <select id="mode" name="mode">
          <option value="top" data-i18n="mode_top"></option>
          <option value="above" data-i18n="mode_above"></option>
        </select>
      </label>
      <label><span data-i18n="horizon"></span>
        <input id="horizon" name="horizon" type="number" min="1" max="5" value="3">
      </label>
      <label><span data-i18n="free_transfers"></span>
        <input id="free" name="free" type="number" min="0" max="5" value="1">
      </label>
      <label><span>
          <span data-i18n="uniqueness"></span>: <output id="uniq-out">0.5</output></span>
        <input id="uniqueness" name="uniqueness" type="range" min="0" max="1" step="0.1" value="0.5">
        <small data-i18n="uniqueness_hint"></small>
      </label>
      <div class="actions">
        <button id="go" type="submit" data-i18n="analyse"></button>
        <button id="copy" type="button" class="ghost" data-i18n="copy_link" hidden></button>
      </div>
    </form>
    <details>
      <summary data-i18n="where_ids"></summary>
      <p data-i18n="where_ids_body"></p>
      <p><code>fantasy.premierleague.com/leagues/<b>156486</b>/standings/c</code><br>
         <code>fantasy.premierleague.com/entry/<b>4006393</b>/event/9</code></p>
    </details>
  </section>

  <div id="status" role="status" aria-live="polite"></div>
  <div class="layout">
    <div id="result" hidden></div>
    <aside id="live" class="live" aria-label="Live league table" hidden></aside>
  </div>

  <footer>
    <p data-i18n="disclaimer"></p>
    <p><a href="https://github.com/dominikfidos/fpl-radar" rel="noopener">GitHub</a> ·
       <a href="/docs" rel="noopener">API</a></p>
  </footer>
</div>

let lang = "en";
try { lang = localStorage.getItem("fpl-lang") || (navigator.language || "en").slice(0, 2); } catch (e) {}
if (!I18N[lang]) lang = "en";
const t = (k) => I18N[lang][k] ?? k;
let lastReport = null;

const $ = (id) => document.getElementById(id);

// Build DOM with textContent only: team and manager names come from strangers.
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll("[data-lang]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (lastReport) render(lastReport);
  renderLive();
}

const price = (p) => "£" + p.price.toFixed(1) + "m";

function playerBlock(p, n, isOut) {
  const owners = Math.round(p.ownership * n);
  return el("div", { class: "player" + (isOut ? " out" : "") },
    el("strong", {}, p.name),
    el("span", { class: "sub" }, `${p.team} · ${p.position} · ${price(p)}`),
    el("span", { class: "sub" }, `${t("pts")} ${p.expected_points.toFixed(1)} · ${t("owned")} ${owners} ${t("of")} ${n}`));
}

function section(title, hint) {
  const box = el("section", {});
  box.append(el("h2", {}, title));
  if (hint) box.append(el("p", { class: "hint" }, hint));
  return box;
}

function captainSection(r) {
  const c = r.captaincy;
  const n = r.meta.rivals.length;
  const sec = section(t("cap_title"), `${t("cap_hint")} (${t("gw")}${c.gameweek}).`);
  if (!c.safe) { sec.append(el("p", {}, t("cap_none"))); return sec; }
  const card = (label, o) => el("div", { class: "cap-card" },
    el("h3", {}, label),
    el("div", { class: "cap-name" }, o.name),
    el("span", { class: "sub" }, `${o.team} · ${o.position} · ${price(o)}`),
    el("span", { class: "sub" }, `${t("pts")} ${t("cap_points")}: ${o.captain_points.toFixed(1)}`),
    el("span", { class: "sub" }, `${t("cap_rivals")}: ${Math.round(o.rival_captain_share * n)} ${t("of")} ${n}`));
  const grid = el("div", { class: "cap-grid" });
  if (c.safe.id === c.differential.id) grid.append(card(t("cap_both"), c.safe));
  else grid.append(card(t("cap_safe"), c.safe), card(t("cap_diff"), c.differential));
  sec.append(grid);
  const others = c.options.filter((o) => o.id !== c.safe.id && o.id !== c.differential.id);
  if (others.length) {
    const det = el("details", {}, el("summary", {}, t("cap_options")));
    const body = el("tbody", {});
    others.forEach((o) => body.append(el("tr", {},
      el("td", {}, `${o.name} (${o.team})`),
      el("td", {}, `${o.captain_points.toFixed(1)} ${t("pts")}`),
      el("td", {}, `${Math.round(o.rival_captain_share * n)}/${n}`))));
    det.append(el("div", { class: "scroll" }, el("table", {}, body)));
    sec.append(det);
  }
  return sec;
}

function fixturesSection(r) {
  const f = r.fixtures;
  const sec = section(t("fx_title"), t("fx_hint"));
  const specials = [];
  Object.entries(f.double).forEach(([gw, teams]) => specials.push(`${t("fx_double")} ${t("gw")}${gw}: ${teams.join(", ")}`));
  Object.entries(f.blank).forEach(([gw, teams]) => specials.push(`${t("fx_blank")} ${t("gw")}${gw}: ${teams.join(", ")}`));
  specials.forEach((text) => sec.append(el("div", { class: "msg info" }, text)));

  const legend = el("p", { class: "legend" });
  [1, 2, 3, 4, 5].forEach((d) => legend.append(el("span", { class: "fx d" + d }, String(d))));
  sec.append(legend);

  const head = el("tr", {}, el("th", {}, t("fx_club")));
  f.gameweeks.forEach((gw) => head.append(el("th", {}, `${t("gw")}${gw}`)));
  const body = el("tbody", {});
  f.ticker.forEach((row) => {
    const tr = el("tr", {}, el("th", { scope: "row" }, el("strong", {}, row.team),
      el("span", { class: "sub" }, row.players.join(", "))));
    row.gameweeks.forEach((g) => {
      const td = el("td", {});
      if (!g.matches.length) td.append(el("span", { class: "fx blank" }, t("fx_blank_cell")));
      g.matches.forEach((m) => {
        const d = Math.min(5, Math.max(1, m.difficulty));
        td.append(el("span", { class: "fx d" + d }, `${m.opponent} (${m.home ? "H" : "A"})`));
      });
      tr.append(td);
    });
    body.append(tr);
  });
  sec.append(el("div", { class: "scroll" }, el("table", { class: "ticker" }, el("thead", {}, head), body)));
  return sec;
}

function transfersSection(r) {
  const n = r.meta.rivals.length;
  const sec = section(t("sug_title"), t("sug_hint"));
  const card = el("div", { class: "card" });
  if (!r.suggestions.length) card.append(el("p", {}, t("sug_none")));
  r.suggestions.forEach((s) => card.append(el("div", { class: "swap" },
    playerBlock(s.out, n, true), el("span", { class: "arrow", "aria-hidden": "true" }, "→"),
    playerBlock(s.in, n, false),
    el("span", { class: "gain", title: t("gain") }, "+" + s.score_gain.toFixed(1)))));
  sec.append(card);
  sec.append(plannerBlock(r));
  return sec;
}

// Plans of 1-2 transfers made together (shared budget, club limit, -4 for extra transfers).
function plannerBlock(r) {
  const n = r.meta.rivals.length;
  const pl = r.planner;
  const box = el("div", {}, el("h2", {}, t("plan_title")),
    el("p", { class: "hint" }, `${t("plan_hint")} (${t("free_transfers")}: ${pl.free_transfers} · ${t("plan_hit")}: −${pl.hit_cost})`));
  if (!pl.plans.length) { box.append(el("p", {}, t("plan_none"))); return box; }
  const signed = (x) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(1);
  pl.plans.forEach((p) => {
    const card = el("div", { class: "card plan" },
      el("h3", { class: "plan-title" }, `${p.transfers} ${t(p.transfers === 1 ? "plan_transfer" : "plan_transfers")}`));
    p.swaps.forEach((s) => card.append(el("div", { class: "swap" },
      playerBlock(s.out, n, true), el("span", { class: "arrow", "aria-hidden": "true" }, "→"),
      playerBlock(s.in, n, false), el("span", {}, ""))));
    const verdict = el("span", { class: p.worth_it ? "gain" : "gain bad" }, t(p.worth_it ? "plan_yes" : "plan_no"));
    const diff = el("span", { class: p.differential ? "gain" : "gain bad" }, t(p.differential ? "plan_diff_yes" : "plan_diff_no"));
    card.append(el("div", { class: "plan-sum" }, verdict, diff,
      el("span", {}, `${t("plan_ep")} ${signed(p.ep_gain)} − ${p.hit} = ${signed(p.net_ep)}`),
      el("span", {}, `${t("plan_net")} ${signed(p.net_score)}`),
      el("span", {}, `${t("bank")} £${p.bank_after.toFixed(1)}m`)));
    box.append(card);
  });
  return box;
}

function pricesSection(r) {
  const p = r.prices;
  const sec = section(t("pr_title"), t("pr_hint"));
  sec.append(el("div", { class: "msg info" },
    t("pr_scale").replace("{rise}", p.rise_pressure).replace("{watch}", p.watch_pressure)));

  const table = (rows) => {
    const head = el("tr", {}, ...["pr_player", "pr_net", "pr_pressure", "pr_status", "pts"]
      .map((k) => el("th", {}, t(k))));
    const body = el("tbody", {});
    rows.forEach((x) => {
      const cls = x.status === "rise" ? "gain" : x.status === "fall" ? "gain bad" : "gain warn";
      body.append(el("tr", { class: x.mine ? "me-row" : "" },
        el("td", {}, el("strong", {}, x.name + (x.mine ? ` (${t("you")})` : "")),
          el("span", { class: "sub" }, `${x.team} · ${x.position} · £${x.price.toFixed(1)}m · ${x.owned_percent}%`)),
        el("td", {}, (x.net_transfers > 0 ? "+" : "") + x.net_transfers.toLocaleString()),
        el("td", {}, (x.pressure > 0 ? "+" : "") + x.pressure.toFixed(2)),
        el("td", {}, el("span", { class: cls }, t("pr_" + x.status)),
          x.changed_this_gw ? el("span", { class: "sub" }, t("pr_moved")) : ""),
        el("td", {}, x.expected_points.toFixed(1))));
    });
    return el("div", { class: "scroll" }, el("table", { class: "pricetbl" }, el("thead", {}, head), body));
  };
  const block = (title, rows) => {
    sec.append(el("h2", {}, title));
    sec.append(rows.length ? table(rows) : el("p", { class: "hint" }, t("pr_none")));
  };
  if (p.my_falling.length) {
    sec.append(el("div", { class: "msg error" }, `${t("pr_my_falling")}: ${p.my_falling.map((x) => x.name).join(", ")}`));
  }
  if (p.my_rising.length) {
    sec.append(el("div", { class: "msg info" }, `${t("pr_my_rising")}: ${p.my_rising.map((x) => x.name).join(", ")}`));
  }
  block(t("pr_risers"), p.risers);
  block(t("pr_fallers"), p.fallers);
  return sec;
}

function gemsSection(r) {
  const n = r.meta.rivals.length;
  const sec = section(t("diff_title"), t("diff_hint"));
  const grid = el("div", { class: "grid2" });
  r.differentials.forEach((p) => grid.append(el("div", { class: "diff" }, playerBlock(p, n, false))));
  sec.append(grid);
  return sec;
}

function coverageSection(r) {
  const n = r.meta.rivals.length;
  const sec = section(t("cov_title"), t("cov_hint"));
  sec.append(el("p", { class: "legend" },
    el("span", {}, el("i", { class: "dot mine" }), t("cov_mine")),
    el("span", {}, el("i", { class: "dot" }), t("cov_other"))));
  const bars = el("div", { class: "bars" });
  r.coverage.filter((row) => row.share > 0).slice(0, 20).forEach((row) => {
    const fill = el("div", { class: "bar-fill" });
    fill.style.width = Math.round(row.share * 100) + "%";
    const name = el("span", { class: "bar-name", title: `${row.name} (${row.team})` },
      row.name + (row.mine ? ` (${t("you")})` : ""));
    bars.append(el("div", { class: "bar-row" + (row.mine ? " mine" : "") },
      name, el("div", { class: "bar-track" }, fill),
      el("span", { class: "bar-count" }, `${row.rivals_owning}/${n}`)));
  });
  sec.append(bars);
  return sec;
}

function infoSection(r) {
  const sec = section(t("rivals_list"));
  const list = el("ul", { class: "notes" });
  r.meta.rivals.forEach((x) =>
    list.append(el("li", {}, `#${x.rank} ${x.team} (${x.manager}) – ${x.total} pts`)));
  sec.append(list);
  if (r.meta.notes.length) {
    sec.append(el("h2", {}, t("notes")));
    const ul = el("ul", { class: "notes" });
    r.meta.notes.forEach((x) => ul.append(el("li", {}, x)));
    sec.append(ul);
  }
  return sec;
}

// Rivals tab: own endpoint, loaded the first time the tab is opened and kept until the next analysis.
let rivalsData = null, rivalsError = "", rivalsBusy = false;
const CHIP_NAMES = { wildcard: "Wildcard", freehit: "Free Hit", bboost: "Bench Boost", "3xc": "Triple Captain" };

function rivalsSection() {
  const sec = section(t("riv_title"), t("riv_hint"));
  const holder = el("div", {});
  sec.append(holder);
  const draw = () => {
    if (rivalsBusy) { holder.replaceChildren(el("div", { class: "msg info" }, t("riv_loading"))); return; }
    if (rivalsError) { holder.replaceChildren(el("div", { class: "msg error" }, rivalsError)); return; }
    if (rivalsData) holder.replaceChildren(rivalsView(rivalsData));
  };
  if (!rivalsData && !rivalsError) loadRivals().then(() => { if (holder.isConnected) draw(); });
  draw();
  return sec;
}

let rivalsPromise = null;
function loadRivals() {
  // Switching tabs while loading must not start a second request: share the running one.
  if (!rivalsPromise) rivalsPromise = fetchRivals().finally(() => { rivalsPromise = null; });

}

async function fetchRivals() {
  rivalsBusy = true; rivalsError = "";

// A tab that loads its own data the first time it is opened and keeps it until the next analysis.
function lazyResource(path, extra) {
  const r = {
    data: null, error: "", busy: false, promise: null,
    reset() { r.data = null; r.error = ""; },
    load() {
      // Switching tabs while loading must not start a second request: share the running one.
      if (!r.promise) r.promise = r.fetchNow().finally(() => { r.promise = null; });
      return r.promise;
    },
    async fetchNow() {
      r.busy = true; r.error = "";
      try {
        const p = params();
        const res = await fetch(`/api/league/${path}?` + new URLSearchParams(
          { league_id: p.league_id, entry_id: p.entry_id, ...extra(p) }));
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          let msg = body.detail;
          if (Array.isArray(msg)) msg = msg.map((d) => d.msg).join("; ");
          r.error = msg || t("error_generic");
        } else r.data = body;
      } catch (e) {
        r.error = t("error_network");
      } finally {
        r.busy = false;
      }
    },
  };
  return r;
}

function historyView(d) {
  const box = el("div", {});
  if (!d.gameweeks.length || !d.series.length) { box.append(el("p", {}, t("hist_empty"))); return box; }
  const gws = d.gameweeks;
  const me = d.series.find((x) => x.is_me);

  // Headline numbers for you.
  if (me) {
    const known = me.ranks.map((r, i) => [r, gws[i]]).filter(([r]) => r != null);
    const [best, bestGw] = known.reduce((a, b) => (b[0] < a[0] ? b : a));
    const now = known[known.length - 1][0];
    const prev = known.length > 1 ? known[known.length - 2][0] : null;
    const move = prev == null || prev === now ? "" : (prev > now ? ` ▲${prev - now}` : ` ▼${now - prev}`);
    const pill = (label, value) => el("span", { class: "pill" }, `${label}: `, el("b", {}, value));
    box.append(el("div", { class: "summary" },
      pill(t("hist_now"), `#${now}${move}`), pill(t("hist_best"), `#${best} (${t("gw")}${bestGw})`)));
  }

  // Legend (always for 2+ series): you in the accent colour, everybody else in grey.
  box.append(el("p", { class: "legend rc-legend" },
    el("span", {}, el("i", { class: "key me" }), t("hist_you")),
    el("span", {}, el("i", { class: "key other" }), t("hist_others"))));

  const wrap = el("div", { class: "rc" });
  const host = el("div", {});
  const tip = el("div", { class: "rc-tip" });
  tip.hidden = true;
  wrap.append(host, tip);
  box.append(wrap);

  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs, ...kids) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, String(v));
    n.append(...kids);
    return n;
  };
  const maxRank = Math.max(...d.series.flatMap((x) => x.ranks.filter((r) => r != null)));
  const ROW = 22, M = { t: 14, r: 104, b: 30, l: 36 };
  const leader = d.series.reduce((a, b) => ((b.ranks.at(-1) ?? 99) < (a.ranks.at(-1) ?? 99) ? b : a));
  const short = (txt) => ((txt || "?").length > 15 ? txt.slice(0, 14) + "…" : txt || "?");
  let idx = gws.length - 1;
  let geo = null; // geometry of the current render, used by the hover layer

  function showTip(i) {
    idx = Math.max(0, Math.min(gws.length - 1, i));
    const rows = d.series.filter((x) => x.ranks[idx] != null).sort((a, b) => a.ranks[idx] - b.ranks[idx]);
    tip.replaceChildren(el("div", { class: "rc-tip-head" }, `${t("gw")}${gws[idx]}`),
      ...rows.map((x) => el("div", { class: "rc-tip-row" + (x.is_me ? " me" : "") },
        el("i", { class: "key " + (x.is_me ? "me" : "other") }),
        el("strong", {}, `#${x.ranks[idx]}`), el("span", {}, `${x.team || "?"} · ${x.totals[idx]} ${t("pts_short")}`))));
    tip.hidden = false;
    const x = geo.x(idx);
    tip.style.top = "6px";
    const tw = tip.offsetWidth;
    tip.style.left = (x + 14 + tw > geo.width ? Math.max(0, x - 14 - tw) : x + 14) + "px";
    geo.cross.setAttribute("x1", x); geo.cross.setAttribute("x2", x);
    geo.cross.style.display = "";
  }
  function hideTip() { tip.hidden = true; if (geo) geo.cross.style.display = "none"; }

  function draw(width) {
    const plotW = width - M.l - M.r, plotH = Math.max(1, maxRank - 1) * ROW, height = plotH + M.t + M.b;
    const x = (i) => M.l + (gws.length === 1 ? plotW / 2 : (i * plotW) / (gws.length - 1));
    const y = (r) => M.t + (r - 1) * ROW;
    const svg = s("svg", { viewBox: `0 0 ${width} ${height}`, width, height, tabindex: 0, role: "img",
      "aria-label": `${t("hist_title")}. ${t("hist_aria")}` });

    // Hairline grid + rank ticks (every rank when few, else 1 and every 5th).
    const ticks = [];
    for (let r = 1; r <= maxRank; r++) if (maxRank <= 10 || r === 1 || r % 5 === 0 || r === maxRank) ticks.push(r);
    ticks.forEach((r) => svg.append(
      s("line", { class: "rc-grid", x1: M.l, x2: width - M.r, y1: y(r), y2: y(r) }),
      s("text", { class: "rc-tick", x: M.l - 8, y: y(r), dy: "0.32em", "text-anchor": "end" }, String(r))));
    const every = Math.max(1, Math.ceil(40 / (gws.length > 1 ? plotW / (gws.length - 1) : 40)));
    gws.forEach((g, i) => { if (i % every === 0 || i === gws.length - 1) svg.append(
      s("text", { class: "rc-tick", x: x(i), y: height - 8, "text-anchor": "middle" }, `${t("gw")}${g}`)); });

    // Lines: everybody else first (grey), you last so you are on top. Gaps in the data break the line.
    const path = (ser) => {
      let dd = "", pen = false;
      ser.ranks.forEach((r, i) => { dd += r == null ? "" : `${pen ? "L" : "M"}${x(i)} ${y(r)} `; pen = r != null; });
      return dd;
    };
    [...d.series.filter((q) => !q.is_me), ...d.series.filter((q) => q.is_me)].forEach((ser) =>
      svg.append(s("path", { class: "rc-line " + (ser.is_me ? "me" : "other"), d: path(ser) })));

    // Direct labels only for you and the current leader (the tooltip and the table carry the rest).
    [...new Set([leader, me].filter(Boolean))].forEach((ser) => {
      const last = ser.ranks.length - 1, r = ser.ranks[last];
      if (r == null) return;
      svg.append(s("circle", { class: "rc-dot " + (ser.is_me ? "me" : "other"), cx: x(last), cy: y(r), r: 4 }),
        s("text", { class: "rc-label" + (ser.is_me ? " me" : ""), x: x(last) + 10, y: y(r), dy: "0.32em" },
          `${ser.is_me ? t("you") + ": " : ""}${short(ser.team)}`));
    });

    // Hover layer: a crosshair that snaps to the nearest gameweek.
    const cross = s("line", { class: "rc-cross", y1: M.t - 6, y2: M.t + plotH + 6 });
    cross.style.display = "none";
    const hit = s("rect", { x: M.l - 12, y: 0, width: plotW + 24, height, fill: "transparent" });
    const at = (e) => {
      const box = svg.getBoundingClientRect();
      return Math.round(((e.clientX - box.left - M.l) / Math.max(1, plotW)) * (gws.length - 1));
    };
    hit.addEventListener("pointermove", (e) => showTip(at(e)));
    hit.addEventListener("pointerleave", hideTip);
    svg.addEventListener("focus", () => showTip(idx));
    svg.addEventListener("blur", hideTip);
    svg.addEventListener("keydown", (e) => {
      const moves = { ArrowLeft: idx - 1, ArrowRight: idx + 1, Home: 0, End: gws.length - 1 };
      if (e.key === "Escape") { hideTip(); return; }
      if (!(e.key in moves)) return;
      e.preventDefault();
      showTip(moves[e.key]);
    });
    svg.append(cross, hit);
    geo = { x, width, cross };
    host.replaceChildren(svg);
  }

  // Draw at the real width and again whenever the card is resized.
  const ro = new ResizeObserver((entries) => {
    if (!wrap.isConnected) { ro.disconnect(); return; }
    const w = Math.floor(entries[0].contentRect.width);
    if (w > 0) { draw(Math.max(w, 300)); hideTip(); }
  });
  ro.observe(wrap);

  // Table view: the same numbers without needing a pointer.
  const head = el("tr", {}, el("th", {}, t("hist_manager")), ...gws.map((g) => el("th", {}, `${t("gw")}${g}`)));
  const body = el("tbody", {});
  [...d.series].sort((a, b) => (a.ranks.at(-1) ?? 99) - (b.ranks.at(-1) ?? 99)).forEach((ser) =>
    body.append(el("tr", { class: ser.is_me ? "me-row" : "" },
      el("td", {}, el("strong", {}, ser.team || "?"), el("span", { class: "sub" }, ser.manager || "")),
      ...ser.ranks.map((r) => el("td", {}, r == null ? "–" : `#${r}`)))));
  box.append(el("details", {}, el("summary", {}, t("hist_table")),
    el("div", { class: "scroll" }, el("table", { class: "pricetbl" }, el("thead", {}, head), body))));
  box.append(el("p", { class: "hint" }, t("hist_note").replace("{n}", d.tracked)));
  return box;
}

// The live table sits next to the report (not in a tab) and refreshes itself every minute.
// It has its own endpoint because the main report is cached much longer.
let liveData = null, liveError = "", liveBusy = false, liveTimer = null;

function renderLive() {
  const box = $("live");
  if (!liveData && !liveError && !liveBusy) { box.hidden = true; return; }
  box.hidden = false;
  const btn = el("button", { type: "button" }, t("live_refresh"));
  btn.disabled = liveBusy;
  btn.addEventListener("click", loadLive);
  const card = el("div", { class: "card" });
  card.append(el("div", { class: "live-head" }, btn,
    el("span", { class: "hint" }, liveBusy ? t("live_loading") : "")));
  if (liveError) card.append(el("div", { class: "msg error" }, liveError));
  if (liveData) card.append(liveTable(liveData));
  box.replaceChildren(el("h2", {}, t("live_title")), el("p", { class: "hint" }, t("live_hint")), card);
}

async function loadLive() {
  if (liveBusy) return;
  liveBusy = true;
  renderLive();
  try {
    const p = params();
    const res = await fetch("/api/league/live?" + new URLSearchParams({ league_id: p.league_id, entry_id: p.entry_id }));
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      let msg = body.detail;
      if (Array.isArray(msg)) msg = msg.map((d) => d.msg).join("; ");
      liveError = msg || t("error_generic");
    } else {
      liveData = body;
      liveError = "";
    }
  } catch (e) {
    liveError = t("error_network");
  } finally {
    liveBusy = false;
    renderLive();
  }
}

function startLive() {
  liveData = null; liveError = "";
  clearInterval(liveTimer);
  liveTimer = setInterval(() => { if (!document.hidden) loadLive(); }, 60000);
  loadLive();
}

function showTab(id, focus) {

  document.querySelectorAll("#result [role=tab]").forEach((b) => {
    const on = b.dataset.tab === tab.id;
    b.setAttribute("aria-selected", String(on));
    b.tabIndex = on ? 0 : -1;
    if (on && focus) b.focus();
  });
  const panel = $("panel");
  panel.setAttribute("aria-labelledby", "tab-" + tab.id);
  panel.replaceChildren(tab.build(lastReport));
  try {
    const u = new URL(location.href);
    u.hash = tab.id;
    history.replaceState(null, "", u);
  } catch (e) {}
}

function render(r) {
  const out = $("result");
  out.replaceChildren();
  const gws = r.meta.horizon_gws;

  const summary = el("div", { class: "summary" });
  const pill = (label, value) => el("span", { class: "pill" }, `${label}: `, el("b", {}, String(value)));
  summary.append(
    pill(t("rank"), "#" + r.meta.my_rank),
    pill(t("analysed"), r.meta.rivals.length),
    pill(t("squads"), `${t("gw")}${r.meta.squad_as_of_gw}`),
    pill(t("bank"), `£${r.meta.bank.toFixed(1)}m`),
    pill(t("ahead"), gws.length ? `${gws[0]}–${gws[gws.length - 1]}` : "-"));
  out.append(summary);

  const bar = el("div", { class: "tabs", role: "tablist", "aria-label": t("tabs_label") });
  TABS.forEach((tab) => bar.append(el("button", {
    type: "button", role: "tab", id: "tab-" + tab.id, "data-tab": tab.id,
    "aria-controls": "panel", "aria-selected": "false", tabindex: "-1",
  }, t(tab.label))));
  bar.addEventListener("click", (e) => {
    const b = e.target.closest("[role=tab]");
    if (b) showTab(b.dataset.tab, false);
  });
  bar.addEventListener("keydown", (e) => {
    const i = TABS.findIndex((x) => x.id === activeTab);
    const moves = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: TABS.length - 1 };
    if (!(e.key in moves)) return;
    e.preventDefault();
    showTab(TABS[(moves[e.key] + TABS.length) % TABS.length].id, true);
  });
  out.append(bar, el("div", { id: "panel", role: "tabpanel", class: "panel", tabindex: "0" }));
  out.hidden = false;
  showTab(activeTab, false);
}

function params() {
  const f = $("form");
  return {
    league_id: f.league.value.trim(), entry_id: f.entry.value.trim(),
    rivals: f.rivals.value, mode: f.mode.value, horizon: f.horizon.value,
    uniqueness: f.uniqueness.value, free_transfers: f.free.value,
  };
}

function shareUrl() {
  const p = params();
  const u = new URL(location.href);
  u.hash = activeTab;
  u.search = new URLSearchParams({ league: p.league_id, entry: p.entry_id, rivals: p.rivals,
    mode: p.mode, horizon: p.horizon, u: p.uniqueness, ft: p.free_transfers }).toString();
  return u.toString();
}

function showStatus(kind, text) {
  const s = $("status");
  s.replaceChildren();
  if (text) s.append(el("div", { class: "msg " + kind }, text));
}

async function analyse() {
  const btn = $("go");
  btn.disabled = true;
  showStatus("info", t("loading"));
  $("result").hidden = true;
  try {
    const res = await fetch("/api/league/report?" + new URLSearchParams(params()));
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      let msg = body.detail;
      if (Array.isArray(msg)) msg = msg.map((d) => d.msg).join("; ");
      showStatus("error", msg || t("error_generic"));
      return;
    }
    showStatus("", "");
    lastReport = body;
    rivalsData = null; rivalsError = "";
    histRes.reset(); modelRes.reset();
    render(body);
    startLive();
    history.replaceState(null, "", shareUrl());
    $("copy").hidden = false;
    try { localStorage.setItem("fpl-ids", JSON.stringify({ league: params().league_id, entry: params().entry_id })); } catch (e) {}
  } catch (e) {
    showStatus("error", t("error_network"));
  } finally {
    btn.disabled = false;
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); analyse(); });
$("uniqueness").addEventListener("input", (e) => { $("uniq-out").textContent = e.target.value; });
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(shareUrl()); $("copy").textContent = t("copied"); }
  catch (e) { prompt("Link", shareUrl()); return; }
  setTimeout(() => { $("copy").textContent = t("copy_link"); }, 1500);
});
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("fpl-lang", lang); } catch (e) {}
  applyLang();
}));

// Fill the form from the link (?league=..&entry=..) or from the last visit.
(function init() {
  const q = new URLSearchParams(location.search);
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("fpl-ids") || "{}"); } catch (e) {}
  const f = $("form");
  f.league.value = q.get("league") || saved.league || "";
  f.entry.value = q.get("entry") || saved.entry || "";
  if (q.get("rivals")) f.rivals.value = q.get("rivals");
  if (q.get("mode")) f.mode.value = q.get("mode");
  if (q.get("horizon")) f.horizon.value = q.get("horizon");
  if (q.get("ft")) f.free.value = q.get("ft");
  if (q.get("u")) { f.uniqueness.value = q.get("u"); $("uniq-out").textContent = f.uniqueness.value; }
  applyLang();
  if (q.get("league") && q.get("entry")) analyse();
})();
</script>
