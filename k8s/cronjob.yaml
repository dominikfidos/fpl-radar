apiVersion: batch/v1
kind: CronJob
metadata:
  name: fpl-collector
spec:
  schedule: "0 * * * *"          # every hour, on the hour (UTC)
  concurrencyPolicy: Forbid      # never run two collectors at once
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2            # retry a failed run up to 2 times
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: collector
              image: ghcr.io/dominikfidos/fpl-radar:latest
              imagePullPolicy: Always
              command: ["python", "-m", "app.collector"]   # same image, different command
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: fpl-db
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
