apiVersion: v1
kind: Service
metadata:
  name: fpl-radar
  labels:
    app: fpl-radar
spec:
  type: ClusterIP        # reachable only inside the cluster
  selector:
    app: fpl-radar       # routes to Ready pods carrying this label
  ports:
    - name: http
      port: 80           # port of the Service
      targetPort: http   # named container port (8000) from the Deployment
