[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W = style errors, F = real mistakes (unused imports, undefined names),
# I = import order, B = likely bugs, UP = outdated syntax.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in default arguments is the normal FastAPI style, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
