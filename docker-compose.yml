services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      # $$ stops Compose from interpolating; the shell inside the container expands it.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    image: devops-portfolio-api:local
    restart: unless-stopped
    environment:
      # "db" is the service name; Docker's internal DNS resolves it on the shared network.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FPL_LEAGUE_ID: ${FPL_LEAGUE_ID:-}
      FPL_ENTRY_ID: ${FPL_ENTRY_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # One-off job: fetches FPL data and saves a snapshot, then exits.
  # Not started by "docker compose up"; run it with:
  #   docker compose run --rm collector
  collector:
    build:
      context: .
      target: runtime
    image: devops-portfolio-api:local
    command: ["python", "-m", "app.collector"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - tools

  # One-off job: builds the league report once (warms the API cache), then exits.
  #   docker compose run --rm league-refresh
  league-refresh:
    build:
      context: .
      target: runtime
    image: devops-portfolio-api:local
    command: ["python", "-m", "app.league.refresh"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FPL_LEAGUE_ID: ${FPL_LEAGUE_ID:-}
      FPL_ENTRY_ID: ${FPL_ENTRY_ID:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - tools

  # Monitoring (optional). Start with:  docker compose --profile monitoring up -d
  # Prometheus: http://127.0.0.1:9090   Grafana: http://127.0.0.1:3000  (login admin / admin)
  # Ports are bound to 127.0.0.1 so they are NOT reachable from other computers.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - backend
    depends_on:
      - api
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - backend
    depends_on:
      - prometheus
    profiles:
      - monitoring

networks:
  backend:

volumes:
  pgdata:
  promdata:
  grafanadata:
